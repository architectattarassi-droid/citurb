# CITURBAREA V150 — Docker Compose Production
# VPS optimisé (DigitalOcean/Hetzner)

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # POSTGRESQL
  # ═══════════════════════════════════════════════════════════════════════════
  
  postgres:
    image: postgres:16-alpine
    container_name: citurbarea_postgres
    restart: always
    environment:
      POSTGRES_DB: citurbarea
      POSTGRES_USER: citurbarea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citurbarea"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND API (NestJS)
  # ═══════════════════════════════════════════════════════════════════════════
  
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: citurbarea_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://citurbarea:${POSTGRES_PASSWORD}@postgres:5432/citurbarea
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./storage:/app/storage
      - ./docs:/app/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (React/Vite)
  # ═══════════════════════════════════════════════════════════════════════════
  
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: citurbarea_web
    restart: always
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

  # ═══════════════════════════════════════════════════════════════════════════
  # NGINX REVERSE PROXY
  # ═══════════════════════════════════════════════════════════════════════════
  
  nginx:
    image: nginx:alpine
    container_name: citurbarea_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
      - api

  # ═══════════════════════════════════════════════════════════════════════════
  # MONITORING (Prometheus + Grafana)
  # ═══════════════════════════════════════════════════════════════════════════
  
  prometheus:
    image: prom/prometheus:latest
    container_name: citurbarea_prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: citurbarea_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_DOMAIN: ${DOMAIN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKUP AUTOMATION
  # ═══════════════════════════════════════════════════════════════════════════
  
  backup:
    image: postgres:16-alpine
    container_name: citurbarea_backup
    restart: "no"
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: citurbarea
      POSTGRES_USER: citurbarea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups/postgres:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: citurbarea_network
