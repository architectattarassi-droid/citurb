name: Daily Backup CITURBAREA

# Layer 3 disaster recovery — snapshot quotidien indépendant des 2 apps Railway.
# Déclenche tous les jours à 03h UTC (= 04h Maroc).
# Push le snapshot vers un repo backup privé organisé par porte.

on:
  schedule:
    # 0 3 * * * → 03h00 UTC tous les jours
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Permet de déclencher manuellement depuis l'onglet Actions
    inputs:
      reason:
        description: "Raison du backup manuel"
        required: false
        default: "Manual trigger"

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout citurb (source)
        uses: actions/checkout@v4
        with:
          path: citurb-source

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: citurb-source/package-lock.json

      - name: Install Prisma client
        run: |
          cd citurb-source
          npm install --legacy-peer-deps --omit=dev || npm install --legacy-peer-deps
          # Generate prisma client
          node ./node_modules/prisma/build/index.js generate --schema prisma/schema.prisma

      - name: Run snapshot script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd citurb-source
          node scripts/snapshot-archive.mjs

      - name: Clone or init backup repo
        env:
          BACKUP_REPO_RAW: ${{ secrets.BACKUP_REPO }}
          BACKUP_TOKEN_RAW: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          # Strip whitespace/newlines des secrets (au cas où l'utilisateur
          # aurait collé avec un newline trailing — sinon git rejette l'URL).
          REPO=$(printf '%s' "$BACKUP_REPO_RAW" | tr -d '[:space:]')
          TOKEN=$(printf '%s' "$BACKUP_TOKEN_RAW" | tr -d '[:space:]')
          REPO_URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"

          # Clone le repo backup. Si le repo est vide (pas de branche main),
          # le clone réussit mais la working dir n'a pas de HEAD. On init dans ce cas.
          git clone "$REPO_URL" citurb-backup || (
            mkdir -p citurb-backup
            cd citurb-backup
            git init
            git remote add origin "$REPO_URL"
          )
          cd citurb-backup
          git config user.name "citurb-backup-bot"
          git config user.email "backup@citurbarea.local"
          # Si pas de branche main encore (repo vide), créer
          if ! git rev-parse --verify main 2>/dev/null >/dev/null; then
            git checkout -b main || git checkout main || true
            if [ ! -f README.md ]; then
              echo "# CITURBAREA — Backup Repository" > README.md
              echo "" >> README.md
              echo "Daily snapshots auto-generated by GitHub Actions." >> README.md
              git add README.md
              git commit -m "init: bootstrap main branch"
              git push -u origin main
            fi
          fi

      - name: Move snapshot into backup repo
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p citurb-backup/snapshots
          rm -rf citurb-backup/snapshots/$DATE 2>/dev/null || true
          mv citurb-source/snapshots/$DATE citurb-backup/snapshots/$DATE
          # Garde au max 90 derniers snapshots (3 mois)
          cd citurb-backup/snapshots
          ls -1 -d */ 2>/dev/null | head -n -90 | xargs -r rm -rf || true

      - name: Commit + push backup
        run: |
          cd citurb-backup
          git add -A
          DATE=$(date -u +%Y-%m-%d)
          if git diff --cached --quiet; then
            echo "Aucun changement à commit (snapshot identique au précédent?)"
          else
            git commit -m "snapshot: $DATE [auto]"
            git push origin main
          fi

      - name: Summary report
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "✅ Backup $DATE pushed to ${{ secrets.BACKUP_REPO }}"
          if [ -d citurb-backup/snapshots/$DATE ]; then
            echo "📊 Stats:"
            wc -l citurb-backup/snapshots/$DATE/*.json 2>/dev/null || true
            ls -la citurb-backup/snapshots/$DATE/dossiers/ 2>/dev/null || true
          fi
