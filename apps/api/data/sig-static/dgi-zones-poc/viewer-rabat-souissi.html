<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>PoC Vectorisation DGI Rabat Souissi — overlay OSM</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body,#map { margin:0; padding:0; height:100%; width:100%; font-family:system-ui; }
    .legend { background:#fff; padding:8px 12px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,.2); font-size:12px; }
    .legend h4 { margin:0 0 6px; font-size:13px; }
    .legend .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
    .legend .swatch { width:14px; height:14px; border:1px solid #333; border-radius:2px; }
    .zone-popup { font-size:12px; }
    .zone-popup b { font-size:13px; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([33.955, -6.83], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OSM contributors'
}).addTo(map);

// Souissi bbox de référence (utilisée pour le géoréférencement affine)
const refBox = L.rectangle([[33.926, -6.860], [33.984, -6.795]], {
  color: '#000', weight: 1, dashArray: '4,4', fill: false
}).addTo(map);
refBox.bindTooltip('Bbox Souissi de référence (affine target)');

// Couleurs par hueRange (correspondance avec le PDF DGI)
function colorForHue(hueRange) {
  if (hueRange.includes('210') || hueRange.includes('220') || hueRange.includes('190') || hueRange.includes('200')) return '#3a86ff'; // bleu
  if (hueRange.includes('0-10') || hueRange.includes('350')) return '#e63946'; // rouge
  if (hueRange.includes('330')) return '#ff6b9d'; // rose
  if (hueRange.includes('40') || hueRange.includes('50')) return '#ffbe0b'; // jaune
  return '#6c757d';
}

// Charger le GeoJSON PoC
fetch('./rabat-souissi.geojson')
  .then(r => r.json())
  .then(gj => {
    const layer = L.geoJSON(gj, {
      style: f => ({
        color: colorForHue(f.properties.hueRange),
        weight: 2,
        fillColor: colorForHue(f.properties.hueRange),
        fillOpacity: 0.5,
      }),
      onEachFeature: (f, l) => {
        const p = f.properties;
        l.bindPopup(`
          <div class="zone-popup">
            <b>${p.zoneId}</b><br>
            Hue : ${p.hueRange}<br>
            Pixels : ${p.pixelCount.toLocaleString('fr')}<br>
            Vertices : ${p.contourVertices}<br>
            Bbox px : ${p.bboxPx.w}×${p.bboxPx.h}<br>
            Centroide px : (${Math.round(p.centroidPx[0])}, ${Math.round(p.centroidPx[1])})
          </div>
        `);
      }
    }).addTo(map);

    map.fitBounds(layer.getBounds(), { padding: [40, 40] });

    // Stats meta
    console.log('Meta:', gj._meta);
    console.log('Features:', gj.features.length);
  });

// Légende
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <h4>PoC vectorisation DGI Rabat</h4>
    <div class="row"><span class="swatch" style="background:#3a86ff"></span>Zone bleue (hue 190–230°)</div>
    <div class="row"><span class="swatch" style="background:#e63946"></span>Zone rouge (hue 0–10°)</div>
    <div class="row"><span class="swatch" style="background:#ff6b9d"></span>Zone rose (hue 330–340°)</div>
    <div class="row" style="margin-top:6px; border-top:1px dashed #999; padding-top:6px;">
      <em>Bbox pointillé noir = ancrage Souissi<br/>(précision ~200m approx.)</em>
    </div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
