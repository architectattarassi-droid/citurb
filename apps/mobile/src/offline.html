<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A2540">
    <title>CITURBAREA — Hors ligne</title>
    <!--
      Page de fallback affichée si server.url (citurbarea.com) est inaccessible.
      Bundled dans www/ via le copy au build et chargée par la WebView en cas
      de NET::ERR_INTERNET_DISCONNECTED.
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0A2540;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .container {
            text-align: center;
            padding: 32px;
            max-width: 480px;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #D4AF37;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            opacity: 0.8;
            margin-bottom: 24px;
        }
        button {
            background: #D4AF37;
            color: #0A2540;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            min-width: 200px;
        }
        button:active {
            transform: scale(0.98);
        }
        .status {
            margin-top: 32px;
            font-size: 13px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CITURBAREA</div>
        <h1>Connexion internet requise</h1>
        <p>L'application a besoin d'internet pour accéder à vos dossiers d'urbanisme. Vérifiez votre connexion WiFi ou données mobiles, puis réessayez.</p>
        <button id="retry">Réessayer</button>
        <div class="status" id="status">Statut : <span id="connection">vérification…</span></div>
    </div>

    <script>
        // Bouton réessayer → recharge la PWA distante
        document.getElementById('retry').addEventListener('click', function () {
            window.location.href = 'https://citurbarea.com';
        });

        // Affiche le statut réseau en temps réel
        function updateStatus() {
            var span = document.getElementById('connection');
            span.textContent = navigator.onLine ? 'en ligne' : 'hors ligne';
            span.style.color = navigator.onLine ? '#7FE7A0' : '#FF8585';
        }
        updateStatus();
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        // Auto-retry si le réseau revient
        window.addEventListener('online', function () {
            setTimeout(function () {
                window.location.href = 'https://citurbarea.com';
            }, 800);
        });
    </script>
</body>
</html>
