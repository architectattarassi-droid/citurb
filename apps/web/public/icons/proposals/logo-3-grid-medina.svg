<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="100%" stop-color="#15294e"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C66A"/>
      <stop offset="100%" stop-color="#B8911D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>
  <!-- Grille irrégulière style médina marocaine -->
  <g stroke="url(#g3)" stroke-width="3" fill="none" opacity="0.85">
    <!-- Ligne 1 (top) -->
    <rect x="120" y="120" width="80" height="60" rx="2"/>
    <rect x="208" y="120" width="100" height="80" rx="2"/>
    <rect x="316" y="120" width="76" height="60" rx="2"/>
    <!-- Ligne 2 (centre) -->
    <rect x="120" y="188" width="60" height="100" rx="2"/>
    <rect x="316" y="208" width="76" height="80" rx="2"/>
    <!-- Ligne 3 (bottom) -->
    <rect x="120" y="296" width="100" height="96" rx="2"/>
    <rect x="228" y="296" width="60" height="60" rx="2"/>
    <rect x="296" y="296" width="96" height="96" rx="2"/>
    <rect x="228" y="364" width="60" height="28" rx="2"/>
  </g>
  <!-- Mosquée centrale (carré plein gold) -->
  <rect x="216" y="208" width="84" height="80" rx="3" fill="url(#g3)"/>
  <!-- Minaret -->
  <rect x="252" y="172" width="12" height="36" rx="1" fill="url(#g3)"/>
  <circle cx="258" cy="168" r="6" fill="url(#g3)"/>
</svg>
