# nginx.conf — CITURBAREA Web (SPA + reverse-proxy vers l'API)
# Tous les préfixes API (cf. CLAUDE.md) sont proxy vers le service API Railway.

# Doctrine : citurbarea.com est attaché au service web. Sans proxy /api/*, toutes
# les requêtes /api/* tombent sur le fallback SPA (index.html). Voir 2026-05-26.
resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 10s;

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # ── PROXY API : tous les préfixes back-end ──
    # On évite la duplication via un seul regex match.
    location ~ ^/(api|auth|health|firms|uploads|webhooks|p[1-6])(/|$) {
        set $upstream "citurb-production.up.railway.app";
        proxy_pass https://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── Assets hashés (cache long) ──
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback (toutes les autres routes → index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
