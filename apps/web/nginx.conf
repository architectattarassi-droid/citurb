# nginx.conf — CITURBAREA Web (SPA + reverse-proxy vers l'API)
# Tous les préfixes API (cf. CLAUDE.md) sont proxy vers le service API Railway.
#
# Subtilité : les préfixes /p1, /p2 … /p6 sont partagés entre :
#   - API (POST endpoints comme /p5/quote, /p2/intake…)
#   - SPA (pages React comme /p5, /p5/finalize, /p1/packs…)
# Stratégie : proxy vers l'API d'abord, et si l'API retourne 404
# (Cannot GET ...), on intercepte et on retourne l'index.html SPA.

resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 10s;

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # ── PROXY API : préfixes purement back-end (jamais SPA) ──
    location ~ ^/(api|auth|health|firms|uploads|webhooks)(/|$) {
        set $upstream "citurb-production.up.railway.app";
        proxy_pass https://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── PROXY p1-p6/* avec fallback SPA si API 404 ──
    # /p5/quote (API existante) → JSON
    # /p5/finalize (SPA route React) → API 404 → fallback /index.html
    # /p5 (SPA root) → SPA direct via location /
    location ~ ^/p[1-6]/ {
        set $upstream "citurb-production.up.railway.app";
        proxy_pass https://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    # Fallback SPA pour les routes /pN/xxx qui n'existent pas côté API
    location @spa_fallback {
        rewrite ^.*$ /index.html last;
    }

    # ── Assets hashés (cache long) ──
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback (toutes les autres routes → index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
