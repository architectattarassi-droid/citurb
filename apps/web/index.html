<!doctype html>
<html lang="fr" dir="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1B3A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CITURBAREA — Plateforme marocaine d'expertise BTP, immobilier et urbanisme. Permis, expertise foncière, marchés de travaux, réseau pro Cercles." />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS / Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CITURBAREA" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- Android / Chrome PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://citurbarea.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Telegram) -->
    <!-- og:image : pour les pages d'articles, le middleware OG du backend (apps/api/src/modules/articles/og-prerender.middleware.ts) intercepte les bots et sert le cover de l'article spécifique. Cette image par défaut sert pour les pages génériques (home, etc.) -->
    <meta property="og:title" content="CITURBAREA — Expertise BTP & Immobilier Maroc" />
    <meta property="og:description" content="Permis, expertise foncière, marchés BTP, réseau pro Cercles." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://citurbarea.com/" />
    <meta property="og:site_name" content="CITURBAREA" />
    <meta property="og:image" content="https://citurbarea.com/og-default.png" />
    <meta property="og:image:secure_url" content="https://citurbarea.com/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CITURBAREA — Plateforme d'orchestration architecturale" />
    <meta property="og:locale" content="fr_MA" />
    <meta property="og:locale:alternate" content="ar_MA" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CITURBAREA — Expertise BTP & Immobilier Maroc" />
    <meta name="twitter:description" content="Permis, expertise foncière, marchés BTP, réseau pro Cercles." />
    <meta name="twitter:image" content="https://citurbarea.com/og-default.png" />
    <meta name="twitter:image:alt" content="CITURBAREA — Plateforme d'orchestration architecturale" />

    <!-- Structured data : Organization (servi dès le HTML initial, pas en JS) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CITURBAREA",
      "url": "https://citurbarea.com",
      "logo": "https://citurbarea.com/icons/icon.svg",
      "description": "Plateforme marocaine d'expertise BTP, immobilier et urbanisme : permis de construire, expertise foncière, marchés de travaux, réseau professionnel Cercles.",
      "areaServed": { "@type": "Country", "name": "Maroc" },
      "sameAs": []
    }
    </script>

    <!-- Preconnect performance -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://services3.arcgis.com" />

    <title>CITURBAREA — Expertise BTP & Immobilier Maroc</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:40px;font-family:system-ui;text-align:center">
        <h1>CITURBAREA nécessite JavaScript</h1>
        <p>Veuillez activer JavaScript pour utiliser la plateforme.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
