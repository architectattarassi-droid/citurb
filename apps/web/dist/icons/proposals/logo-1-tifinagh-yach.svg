<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg1" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#1a2f5f"/>
      <stop offset="100%" stop-color="#0B1B3A"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C66A"/>
      <stop offset="100%" stop-color="#B8911D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>
  <!-- Tifinagh ⵛ (Yach) — lettre amazigh "CH" / "C" — symbole identitaire MA -->
  <g stroke="url(#g1)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Trois branches verticales du ⵛ -->
    <path d="M 168 144 L 168 368"/>
    <path d="M 256 144 L 256 368"/>
    <path d="M 344 144 L 344 368"/>
    <!-- Connexion supérieure courbée (caractéristique du Yach) -->
    <path d="M 168 200 Q 256 144 344 200"/>
  </g>
  <!-- Ligne d'horizon subtile -->
  <rect x="120" y="408" width="272" height="4" rx="2" fill="url(#g1)" opacity="0.7"/>
</svg>
