<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15294e"/>
      <stop offset="100%" stop-color="#0B1B3A"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C66A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <pattern id="diag2" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#E8C66A" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg2)"/>
  <rect width="512" height="512" rx="112" fill="url(#diag2)"/>
  <!-- Monogram C+T entrelacés -->
  <g stroke="url(#g2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- C ouvert à droite -->
    <path d="M 360 160 Q 200 160 200 256 Q 200 352 360 352"/>
    <!-- T barre horizontale + verticale -->
    <path d="M 200 200 L 360 200"/>
    <path d="M 280 200 L 280 360"/>
  </g>
</svg>
